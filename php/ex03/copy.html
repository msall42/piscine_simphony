<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Skills</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <ul>
            <li>
                <h2>Frontend</h2>

                <p data-value="80" style="--progresstool-width: 80%;">HTML5</p>
                <progress class="html5" value="80" max="100">80%</progress>

                <p data-value="60" style="--progresstool-width: 60%;">CSS3</p>
                <progress class="css3" value="60" max="100">60%</progress>

                <p data-value="50" style="--progresstool-width: 50%;">jQuery</p>
                <progress class="jquery" value="50" max="100">50%</progress>
            </li>

            <li>
                <h2>Backend</h2>

                <p data-value="75" style="--progresstool-width: 75%;">Python</p>
                <progress class="python" value="75" max="100">75%</progress>

                <p data-value="65" style="--progresstool-width: 75%;">PHP</p>
                <progress class="php" value="65" max="100">65%</progress>

                <p data-value="35" style="--progresstool-width: 35%;">Node.js</p>
                <progress class="node-js" value="35" max="100">35%</progress>
            </li>
        </ul>
    </main>
</body>
</html>
